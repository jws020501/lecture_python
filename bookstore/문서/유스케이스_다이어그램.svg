<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>온라인 서점 유즈케이스 다이어그램 (코드 기준)</title>
  <desc>비회원, 회원, 관리자 세 액터가 실제 코드의 기능에 평범한 선으로 연결</desc>
  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>

  <text x="490" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">온라인 서점 시스템 — 유즈케이스 다이어그램</text>

  <!-- 액터: 비회원 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="80" cy="115" r="15"/>
    <line x1="80" y1="130" x2="80" y2="178"/>
    <line x1="54" y1="148" x2="106" y2="148"/>
    <line x1="80" y1="178" x2="58" y2="205"/>
    <line x1="80" y1="178" x2="102" y2="205"/>
  </g>
  <text x="80" y="226" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="bold">비회원</text>

  <!-- 액터: 회원 -->
  <g stroke="#1565c0" stroke-width="2" fill="none">
    <circle cx="80" cy="450" r="15"/>
    <line x1="80" y1="465" x2="80" y2="513"/>
    <line x1="54" y1="483" x2="106" y2="483"/>
    <line x1="80" y1="513" x2="58" y2="540"/>
    <line x1="80" y1="513" x2="102" y2="540"/>
  </g>
  <text x="80" y="561" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">회원</text>

  <!-- 액터: 관리자 -->
  <g stroke="#c62828" stroke-width="2" fill="none">
    <circle cx="900" cy="300" r="15"/>
    <line x1="900" y1="315" x2="900" y2="363"/>
    <line x1="874" y1="333" x2="926" y2="333"/>
    <line x1="900" y1="363" x2="878" y2="390"/>
    <line x1="900" y1="363" x2="922" y2="390"/>
  </g>
  <text x="900" y="411" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">관리자</text>

  <!-- 연결선 -->
  <g stroke="#888" stroke-width="1.1" fill="none">
    <line x1="108" y1="120" x2="292" y2="72"/>
    <line x1="108" y1="128" x2="292" y2="124"/>
    <line x1="108" y1="140" x2="292" y2="176"/>
    <line x1="108" y1="445" x2="292" y2="76"/>
    <line x1="108" y1="448" x2="292" y2="228"/>
    <line x1="108" y1="451" x2="292" y2="280"/>
    <line x1="108" y1="454" x2="292" y2="332"/>
    <line x1="108" y1="457" x2="292" y2="384"/>
    <line x1="108" y1="460" x2="292" y2="436"/>
    <line x1="108" y1="463" x2="292" y2="488"/>
    <line x1="108" y1="466" x2="292" y2="540"/>
    <line x1="108" y1="469" x2="292" y2="592"/>
    <line x1="872" y1="296" x2="468" y2="176"/>
    <line x1="872" y1="300" x2="728" y2="180"/>
    <line x1="872" y1="304" x2="728" y2="232"/>
    <line x1="872" y1="308" x2="728" y2="284"/>
    <line x1="872" y1="312" x2="728" y2="336"/>
    <line x1="872" y1="316" x2="728" y2="388"/>
    <line x1="872" y1="320" x2="728" y2="440"/>
  </g>

  <!-- 유즈케이스 A열 -->
  <ellipse cx="380" cy="72" rx="88" ry="20" fill="#f4f6f8" stroke="#555" stroke-width="1.4"/>
  <text x="380" y="76" text-anchor="middle" font-size="12" fill="#1a1a2e">책 목록 보기</text>
  <ellipse cx="380" cy="124" rx="88" ry="20" fill="#f4f6f8" stroke="#555" stroke-width="1.4"/>
  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#1a1a2e">회원가입</text>
  <ellipse cx="380" cy="176" rx="88" ry="20" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#1a1a2e">로그인</text>
  <ellipse cx="380" cy="228" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#1a1a2e">장바구니 담기</text>
  <ellipse cx="380" cy="280" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="284" text-anchor="middle" font-size="12" fill="#1a1a2e">즉시 주문</text>
  <ellipse cx="380" cy="332" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="336" text-anchor="middle" font-size="11.5" fill="#1a1a2e">장바구니 조회·결제</text>
  <ellipse cx="380" cy="384" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="388" text-anchor="middle" font-size="12" fill="#1a1a2e">주문 내역 조회</text>
  <ellipse cx="380" cy="436" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="440" text-anchor="middle" font-size="12" fill="#1a1a2e">배송지 변경</text>
  <ellipse cx="380" cy="488" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="492" text-anchor="middle" font-size="12" fill="#1a1a2e">비밀번호 변경</text>
  <ellipse cx="380" cy="540" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="544" text-anchor="middle" font-size="12" fill="#1a1a2e">회원 탈퇴</text>
  <ellipse cx="380" cy="592" rx="88" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="380" y="596" text-anchor="middle" font-size="12" fill="#1a1a2e">로그아웃</text>

  <!-- 유즈케이스 B열 (관리자) -->
  <ellipse cx="640" cy="180" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="184" text-anchor="middle" font-size="12" fill="#1a1a2e">회원 목록 조회</text>
  <ellipse cx="640" cy="232" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="236" text-anchor="middle" font-size="12" fill="#1a1a2e">회원 강퇴</text>
  <ellipse cx="640" cy="284" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="288" text-anchor="middle" font-size="12" fill="#1a1a2e">도서 등록</text>
  <ellipse cx="640" cy="336" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="340" text-anchor="middle" font-size="12" fill="#1a1a2e">도서 정보 수정</text>
  <ellipse cx="640" cy="388" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="392" text-anchor="middle" font-size="12" fill="#1a1a2e">도서 삭제</text>
  <ellipse cx="640" cy="440" rx="88" ry="20" fill="#fde8e8" stroke="#c62828" stroke-width="1.4"/>
  <text x="640" y="444" text-anchor="middle" font-size="12" fill="#1a1a2e">로그아웃</text>

  <!-- 범례 -->
  <rect x="600" y="560" width="200" height="110" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="612" y="580" font-size="11" font-weight="bold" fill="#333">범례 (액터별 색)</text>
  <ellipse cx="624" cy="598" rx="11" ry="7" fill="#f4f6f8" stroke="#555" stroke-width="1.2"/>
  <text x="642" y="601" font-size="10" fill="#333">비회원 / 공통 기능</text>
  <ellipse cx="624" cy="620" rx="11" ry="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="642" y="623" font-size="10" fill="#333">회원 전용 기능</text>
  <ellipse cx="624" cy="642" rx="11" ry="7" fill="#fde8e8" stroke="#c62828" stroke-width="1.2"/>
  <text x="642" y="645" font-size="10" fill="#333">관리자 전용 기능</text>
  <ellipse cx="624" cy="662" rx="11" ry="7" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="642" y="665" font-size="10" fill="#333">로그인(비회원·관리자 공유)</text>
</svg>
